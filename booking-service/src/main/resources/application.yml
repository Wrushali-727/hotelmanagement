server:
  port: 8084

spring:
  application:
    name: booking-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/booking_service_db}
    username: ${SPRING_DATASOURCE_USERNAME:hotel_user}
    password: ${SPRING_DATASOURCE_PASSWORD:hotel_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/hotel-management}

services:
  hotel-service:
    url: ${HOTEL_SERVICE_URL:http://localhost:8083}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
